name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ina
          POSTGRES_PASSWORD: ina
          POSTGRES_DB: ina_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ina -d ina_test"
          --health-interval 2s
          --health-retries 30
      redis:
        image: redis:7.4.12
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-retries 30
      rabbitmq:
        image: rabbitmq:4.4.0
        env:
          RABBITMQ_DEFAULT_USER: ina
          RABBITMQ_DEFAULT_PASS: ina
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-retries 30
      opensearch:
        image: opensearchproject/opensearch:2.19.7
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs localhost:9200/_cluster/health"
          --health-interval 5s
          --health-retries 60
    env:
      INA_TEST_DATABASE_URL: postgresql+asyncpg://ina:ina@localhost:5432/ina_test
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: uv sync --locked
      - name: ruff
        run: mise run lint
      - name: mypy
        run: mise run typecheck
      - name: biome
        run: mise run biome
      - name: djlint
        run: uv run djlint --check --lint app/templates
      # Started here, not as a service, because it needs its credentials file.
      - name: seaweedfs
        run: |
          mkdir -p "$RUNNER_TEMP/seaweedfs"
          cat > "$RUNNER_TEMP/seaweedfs/s3.json" <<'JSON'
          {"identities": [{"name": "ina",
                           "credentials": [{"accessKey": "ina", "secretKey": "ina-dev-secret"}],
                           "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
          JSON
          docker run -d --name seaweedfs -p 8333:8333 -p 9333:9333 \
            -v "$RUNNER_TEMP/seaweedfs:/etc/seaweedfs" chrislusf/seaweedfs:4.50 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for _ in $(seq 1 60); do
            curl -fs 127.0.0.1:8333/healthz && curl -fs 127.0.0.1:9333/dir/status | grep -q DataNodes && exit 0
            sleep 2
          done
          exit 1
      - name: pytest
        run: mise run test

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  snudown:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: uv sync --locked
      - name: snudown's own test suite
        run: mise run test-snudown
