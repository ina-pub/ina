{%- extends "base.html" -%}
{%- from "macros/forms.html" import error_field, field_class -%}
{%- block content %}
  <h1>choose a new password</h1>
  <form method="post" action="/api/resetpassword" id="chpass">
    <input type="hidden" name="key" value="{{ view.key }}">
    <p class="{{ field_class(view.errors, 'passwd') }}">
      <label for="passwd">new password</label>
      <input type="password" name="passwd" id="passwd" autocomplete="new-password">
      {{ error_field(view.errors, 'passwd') }}
    </p>
    <p class="{{ field_class(view.errors, 'passwd2') }}">
      <label for="passwd2">the same password again</label>
      <input type="password"
             name="passwd2"
             id="passwd2"
             autocomplete="new-password">
      {{ error_field(view.errors, 'passwd2') }}
    </p>
    <p class="actions">
      <button type="submit" class="btn primary">set password</button>
    </p>
  </form>
{%- endblock %}
