{#- Every page in the wiki the viewer may see. -#}
{%- extends "wiki_page.html" -%}
{%- block wikititle %}all pages{% endblock %}
{%- block wiki %}
  <ul class="pagelisting">
    {%- for name in view.names %}
      <li>
        <a href="{{ view.base_url }}/{{ name }}">{{ name }}</a>
      </li>
    {%- else %}
      <li class="empty">no pages yet</li>
    {%- endfor %}
  </ul>
{%- endblock %}
